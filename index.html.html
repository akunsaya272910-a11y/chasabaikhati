<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chasa Luarmasse ✨ Web Biodata</title>
<style>
:root{--bg:#fff8ee;--card:#fff;--tx:#1d1b3a;--mu:#6b6788;--pr:#4f46e5;--ac:#ff6b9d;--ye:#ffc93c;--bd:#e8e2f5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14122b;--card:#201d42;--tx:#f4f1ff;--mu:#b3aed6;--pr:#8b85ff;--bd:#35316a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14122b;--card:#201d42;--tx:#f4f1ff;--mu:#b3aed6;--pr:#8b85ff;--bd:#35316a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 "Segoe UI",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--card);border-bottom:2px solid var(--bd);display:flex;gap:6px;padding:8px 12px;overflow-x:auto;align-items:center}
nav b{margin-right:auto;white-space:nowrap;color:var(--pr)}
nav a{white-space:nowrap;padding:6px 12px;border-radius:99px;color:var(--tx);text-decoration:none;font-weight:600;font-size:14px}
nav a.on,nav a:hover{background:var(--pr);color:#fff}
main{max-width:860px;margin:0 auto;padding:20px 16px 60px}
h1,h2{line-height:1.2}h1{font-size:2rem;margin:.2em 0}
.card{background:var(--card);border:2px solid var(--bd);border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 4px 0 var(--bd)}
.hero{text-align:center}
.pic{width:190px;height:190px;border-radius:50%;object-fit:cover;object-position:50% 45%;border:6px solid var(--ye);box-shadow:0 0 0 6px var(--ac);margin:8px auto;display:block}
.btn{display:inline-block;border:0;cursor:pointer;background:var(--pr);color:#fff;padding:10px 20px;border-radius:14px;font:inherit;font-weight:700;text-decoration:none;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.btn.alt{background:var(--ac)}.btn:active{transform:translateY(2px)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
table{width:100%;border-collapse:collapse}td{padding:8px 6px;border-bottom:1px dashed var(--bd);vertical-align:top}td:first-child{font-weight:700;width:42%}
.chip{border:2px solid var(--bd);background:var(--bg);color:var(--tx);padding:6px 14px;border-radius:99px;font:inherit;font-weight:600;cursor:pointer;margin:3px}
.chip.on{background:var(--ye);border-color:var(--ye);color:#1d1b3a}
.mu{color:var(--mu)}.tag{display:inline-block;background:var(--ye);color:#1d1b3a;border-radius:99px;padding:2px 10px;font-size:13px;font-weight:700;margin:2px}
.opt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;margin:8px 0;padding:12px;border:2px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);font:inherit;font-weight:600;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--pr)}.opt.ok{background:#22c55e;border-color:#22c55e;color:#fff}.opt.no{background:#ef4444;border-color:#ef4444;color:#fff}
.opt span.l{background:var(--pr);color:#fff;border-radius:8px;padding:0 9px}
.bar{height:10px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
svg.map{width:100%;height:auto;background:#bfe3ff;border-radius:14px;display:block}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) svg.map{background:#1d3a5f}}
.pulse{animation:p 1s infinite}@keyframes p{50%{r:9;opacity:.4}}
.big{font-size:3rem;text-align:center}.split{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:center}.split .grid{grid-template-columns:1fr;gap:12px}.split .hero,.split .grid .card{margin:0}.split .grid .card h2{margin:0 0 4px}.split .grid .card p{margin:0}@media(max-width:700px){.split{grid-template-columns:1fr}}.fly{animation:fly 2.2s ease-in-out forwards}@keyframes fly{0%{transform:translate(var(--sx),var(--sy));opacity:1}90%{opacity:1}100%{transform:translate(var(--tx),var(--ty));opacity:0}}.trail{stroke-dasharray:1 1;stroke-dashoffset:1;animation:tr 2.2s ease-in-out forwards}@keyframes tr{to{stroke-dashoffset:0}}.dot{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .45s 2.2s forwards}@keyframes pop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}.rip{opacity:0;animation:rip 1.2s 2.4s infinite}@keyframes rip{0%{r:2;opacity:.9}100%{r:13;opacity:0}}@media(prefers-reduced-motion:reduce){.fly,.trail{display:none}.dot{animation:none;opacity:1}}.fg{display:inline-block;vertical-align:middle;width:36px;height:24px;margin-right:6px;border-radius:3px;box-shadow:0 0 0 1px #ffffff55;flex:none}
footer{text-align:center;color:var(--mu);padding:20px}
:root:root:root{--bg:#120a2e;--card:rgba(28,18,66,.82);--tx:#f5f0ff;--mu:#c9bff2;--pr:#8b5cf6;--ac:#c084fc;--ye:#b9a6ff;--bd:#4b3a93;color-scheme:dark}

<section class="card"><h2>💖 Hobi</h2><span class="tag">📜 Sejarah unik</span><span class="tag">🌍 Geografi negara</span><span class="tag">🎧 Mendengar musik</span><span class="tag">💻 Membuat aplikasi</span><span class="tag">🌐 Membuat website</span></section>

coding:()=>`<h1>💻 Coding &amp; AI</h1><section class="card"><h2>👨‍💻 Apa itu Coding?</h2><p>Coding adalah menulis instruksi untuk komputer memakai bahasa pemrograman. Dengan coding kita bisa bikin website, aplikasi, dan game! 🎮</p></section>
<section class="card"><h2>🧱 Tiga Dasar Web</h2><p><span class="tag">HTML</span> kerangka halaman 🏠<br><span class="tag">CSS</span> tampilan &amp; warna 🎨<br><span class="tag">JavaScript</span> interaksi &amp; logika ⚡</p></section>
<section class="card"><h2>🤖 Apa itu AI?</h2><p>AI (Artificial Intelligence atau kecerdasan buatan) adalah program yang bisa belajar dari data untuk mengenali gambar, memahami bahasa, menjawab pertanyaan, atau membantu menulis kode. 🧠✨</p></section>
<section class="card"><h2>🗺️ Tips Belajar</h2><p>1️⃣ Mulai dari proyek kecil<br>2️⃣ Coba, salah, lalu perbaiki 🐞<br>3️⃣ Latihan sedikit tiap hari 📅<br>4️⃣ Gunakan AI sebagai teman belajar, tapi tetap pahami kodenya 💡<br>5️⃣ Jangan takut error, semua programmer pernah mengalaminya 😆</p></section>
<section class="card"><h2>🧰 Bahasa Populer</h2><span class="tag">Python 🐍</span><span class="tag">JavaScript 🟨</span><span class="tag">Java ☕</span><span class="tag">PHP 🐘</span><span class="tag">Kotlin 📱</span></section>`,
portofolio:()=>`<h1>🖼️ Portofolio</h1><h2>Karya-Karya Kecilku</h2><p class='mu'>Kumpulan karya kecil buatanku. Semoga suka ya! 😄✨</p>${PF.length?`<div class='grid pfg'>${PF.map((p,i)=>`<button class='card pf' onclick='openPF(${i})'>${p.img?`<img src='${p.img}' alt='${p.t}'>`:''}<h2>${p.t}</h2><span class='mu'>👆 Ketuk untuk lihat penjelasan</span></button>`).join('')}</div>`:`<section class='card hero'><div class='big'>🚧🎨</div><h2>Karya segera hadir!</h2><p class='mu'>Chasa sedang menyiapkan karya-karya kecilnya. Tunggu ya! ⏳💜</p></section>`}`,
kontak:()=>`<h1>📱 Kontak</h1><section class="card hero"><img class="pic" src="${IMG}" alt="Foto Chasa"><h2>Lionel Chasa Luarmasse</h2><p><a class="btn" href="tel:085219972624">📞 085219972624</a></p><p><a class="btn alt" href="mailto:akunsaya272910@gmail.com">✉️ akunsaya272910@gmail.com</a></p><p><a class="btn" href="https://instagram.com/nelsase_" target="_blank" rel="noopener">📸 @nelsase_</a></p><p class="mu">Yuk berteman! 🤝😊</p></section>`,
game:()=>{const card=(t,ic,d)=>`<section class="card"><h2>${ic} ${t.n}</h2><p class="mu">${d}</p><div>${Object.keys(L).map(k=>`<button class="chip ${S[t.k]==k?"on":""}" onclick="S.${t.k}='${k}';route()">${L[k]}</button>`).join("")}</div><p><button class="btn" onclick="location.hash='main-${t.k}-'+S.${t.k}">▶️ Mulai</button></p></section>`;
return `<h1>🎮 Game Tebak Negara</h1><p class="mu">Pilih game dan tingkat kesulitan, lalu tekan Mulai! 🚀</p><div class="grid">${card({n:"Tebak dari Peta",k:"peta"},"🗺️","Lihat titik merah di peta, tebak negaranya!")}${card({n:"Tebak dari Sejarah",k:"sej"},"📜","Baca petunjuk sejarah unik, tebak negaranya!")}${card({n:"Tebak dari Rekor Dunia",k:"rek"},"🏆","Negara mana yang memegang rekor atau gelar dunia?")}${card({n:"Tebak Lagu AKB48",k:"lagu"},"🎶","Tebak judul lagu AKB48 dari ciri-cirinya!")}</div>`}};
const S={peta:"m",sej:"m",rek:"m",lagu:"m"};
let Q;
function startQuiz(type,lv){const pool=C.filter(c=>c[5]==lv);
Q=type=="peta"?{type,lv,i:0,sc:0,items:sh(pool).slice(0,10).map(c=>({c,a:c[0]}))}:{type,lv,i:0,sc:0,items:sh((type=="rek"?RK:type=="lagu"?LG:H).filter(h=>h[0]==lv)).slice(0,10).map(h=>({h,a:h[2]}))};
Q.items.forEach(it=>{const others=type=="lagu"?sh(SG.filter(x=>x!=it.a)).slice(0,3):sh(C.filter(c=>c[0]!=it.a&&(lv=="m"?true:c[5]==lv||Math.random()<.3))).slice(0,3).map(c=>c[0]);it.o=sh([it.a,...others])});quiz()}
function quiz(){const it=Q.items[Q.i],n=Q.items.length;
if(!it){const p=Q.sc/n;app.innerHTML=`<section class="card hero"><div class="big">${p>.8?"🏆":p>.5?"🎉":"💪"}</div><h1>Skor: ${Q.sc}/${n}</h1><p>${p>.8?"Keren banget, kamu jagoan dunia! 🌍🔥":p>.5?"Bagus! Latihan lagi biar makin jago 😄":"Semangat! Coba lagi ya, pasti bisa 🚀"}</p><button class="btn" onclick="startQuiz('${Q.type}','${Q.lv}')">🔄 Main Lagi</button> <a class="btn alt" href="#game">🎮 Menu Game</a></section>`;return}
const body=Q.type=="peta"?`<p><b>Negara apa yang ditandai titik merah?</b> 📍</p>${mapSvg(it.c[2],it.c[3])}${Q.lv=="m"?`<p class="mu">💡 Petunjuk benua: ${it.c[4]}</p>`:""}<p class="mu" style="font-size:13px">Peta disederhanakan, perhatikan posisinya ya 🧭</p>`:`<p style="font-size:1.15rem"><b>${it.h[1]}</b></p><p class="mu">${Q.type=="lagu"?"Lagu AKB48 apakah ini?":"Negara apakah ini?"} 🤔</p>`;
app.innerHTML=`<h1>${Q.type=="peta"?"🗺️ Tebak dari Peta":Q.type=="rek"?"🏆 Tebak dari Rekor Dunia":Q.type=="lagu"?"🎶 Tebak Lagu AKB48":"📜 Tebak dari Sejarah"} · ${L[Q.lv]}</h1><div class="bar"><i style="width:${Q.i/n*100}%"></i></div><p class="mu">Soal ${Q.i+1} dari ${n} · Skor ${Q.sc} ⭐</p><section class="card">${body}<div id="o">${it.o.map((o,k)=>`<button class="opt" data-o="${o}"><span class="l">${"ABCD"[k]}</span><span>${fl(o)} ${o}</span></button>`).join("")}</div><div id="f"></div></section><a href="#game" class="mu">← Keluar ke menu game</a>`;
document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const ok=b.dataset.o==it.a;if(ok)Q.sc++;document.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.dataset.o==it.a)x.classList.add("ok")});if(!ok)b.classList.add("no");
$("#f").innerHTML=`<p>${ok?"✅ Benar! 🎉":"❌ Oops, jawabannya "+fl(it.a)+" "+it.a+" 😅"}</p>${it.h?`<p class="mu">💡 ${it.h[3]}</p>`:""}<p class="mu">⏭️ Lanjut otomatis...</p>`;const q=Q;setTimeout(()=>{if(Q===q&&location.hash.startsWith("#main")){Q.i++;quiz()}},2000)})}
function openPF(i){closePF();const p=PF[i],o=document.createElement('div');o.id='pfm';o.className='ov';o.onclick=e=>{if(e.target===o)closePF()};o.innerHTML=`<div class='mod' role='dialog' aria-modal='true'><button class='x' onclick='closePF()' aria-label='Tutup'>✖</button>${p.img?`<img src='${p.img}' alt='${p.t}'>`:''}<h2>${p.t}</h2><p>${p.d}</p><button class='btn' onclick='closePF()'>Tutup 👍</button></div>`;document.body.appendChild(o)}
function closePF(){const o=document.getElementById('pfm');if(o)o.remove()}
addEventListener('keydown',e=>{if(e.key==='Escape')closePF()});
function route(){closePF();const h=location.hash.slice(1)||"beranda";scrollTo(0,0);
document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")=="#"+(h.startsWith("main")?"game":h)));
if(h.startsWith("main-")){const[,t,l]=h.split("-");if(["peta","sej","rek","lagu"].includes(t)&&L[l])return startQuiz(t,l)}
app.innerHTML=(V[h]||V.beranda)()}
addEventListener("hashchange",route);route();
</script></body></html>
